<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060c">
<meta name="description" content="23组号码顺序揭晓系统">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-512.png">
<title>数码揭晓系统 · 宝库版</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#05060c;--line:rgba(255,255,255,.08)}
html,body{min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
body{background:radial-gradient(1200px 650px at 50% 115%,rgba(255,190,60,.16),transparent 60%),radial-gradient(900px 500px at 50% -10%,rgba(120,160,255,.13),transparent 65%),#05060c;color:#e8ecf5;overflow-x:hidden}
#treasureBg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.8}
body:before{content:"";position:fixed;inset:0;z-index:1;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse,black 25%,transparent 85%)}
.toolbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px max(16px,env(safe-area-inset-left));background:rgba(6,8,16,.88);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:800;letter-spacing:3px;color:#dfe8ff}
.brand-dot{width:9px;height:9px;border-radius:50%;background:#4f8cff;box-shadow:0 0 14px #4f8cff;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.4;transform:scale(.8)}}
.controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
button,select{font:inherit;font-size:13px;padding:9px 12px;border-radius:9px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.055);color:#dbe3f5}
button{cursor:pointer;white-space:nowrap}
button:disabled{opacity:.35;cursor:not-allowed}
button.primary{background:linear-gradient(135deg,#4f8cff,#5ee7ff);border:0;color:#04121f;font-weight:800}
select option{background:#0a0e1c}
.stage{position:relative;z-index:2;max-width:1500px;margin:auto;padding:22px 18px 50px;display:flex;flex-direction:column;gap:16px}
.top-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.block{--color:#fff;--rgb:255,255,255;position:relative;border-radius:17px;padding:15px;background:linear-gradient(165deg,rgba(255,255,255,.06),rgba(255,255,255,.012));border:1px solid rgba(var(--rgb),.22);box-shadow:0 0 42px -25px rgba(var(--rgb),.8),inset 0 1px rgba(255,255,255,.06);overflow:hidden;transition:.35s}
.block:after{content:"";position:absolute;inset:0;background:radial-gradient(500px 160px at 50% -40%,rgba(var(--rgb),.15),transparent 70%);pointer-events:none}
.block.active{border-color:rgba(var(--rgb),.8);box-shadow:0 0 55px -15px rgba(var(--rgb),.8);transform:translateY(-2px)}
.block-header{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.block-name{font-size:14px;letter-spacing:4px;font-weight:800;color:var(--color);text-shadow:0 0 14px rgba(var(--rgb),.7)}
.block-count{font-size:11px;color:rgba(255,255,255,.4)}
.grid{position:relative;z-index:1;display:grid;gap:9px}
.top-row .grid{grid-template-columns:1fr;justify-items:center}
.slot{display:flex;gap:5px;padding:8px;border-radius:12px;background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.06);transition:.3s}
.slot.revealing{border-color:rgba(var(--rgb),.7);box-shadow:0 0 24px -8px rgba(var(--rgb),.9)}
.slot.revealed{background:rgba(var(--rgb),.07);border-color:rgba(var(--rgb),.35)}
.digit{width:clamp(34px,4vw,52px);height:clamp(45px,5vw,68px);display:grid;place-items:center;border-radius:9px;background:linear-gradient(#0c1020,#060812);border:1px solid rgba(255,255,255,.08);font-family:ui-monospace,monospace;font-size:clamp(24px,3vw,38px);font-weight:800;color:rgba(255,255,255,.14);position:relative;overflow:hidden}
.digit:before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.6)}
.digit.spinning{color:var(--color);text-shadow:0 0 16px rgba(var(--rgb),.9);opacity:.9}
.digit.locked{color:var(--color);text-shadow:0 0 15px rgba(var(--rgb),.9);border-color:rgba(var(--rgb),.45)}
.block.crystal .grid,.block.amber .grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
.block.crystal .slot,.block.amber .slot{gap:3px;padding:6px}
.block.crystal .digit,.block.amber .digit{width:clamp(22px,2.6vw,36px);height:clamp(33px,3.5vw,48px);font-size:clamp(16px,2vw,26px);border-radius:7px}
.status{text-align:center;color:rgba(255,255,255,.45);font-size:12px;letter-spacing:1px;padding:2px}
.overlay,.celebration{position:fixed;inset:0;z-index:30;display:none}
.overlay.open{display:block;background:rgba(2,4,10,.9);backdrop-filter:blur(12px);overflow:auto;padding:18px}
.overlay-inner{max-width:1000px;margin:10px auto;background:linear-gradient(#0b1020,#080b16);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:22px}
.overlay-header{display:flex;justify-content:space-between;gap:12px;align-items:end;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:18px}
.overlay-header h2{font-size:20px;letter-spacing:2px}
.overlay-header p{font-size:12px;color:rgba(255,255,255,.45);margin-top:6px}
.config-body{display:flex;flex-direction:column;gap:14px}
.cfg-block{--color:#fff;--rgb:255,255,255;border:1px solid rgba(var(--rgb),.2);border-radius:13px;padding:14px;background:rgba(255,255,255,.02)}
.cfg-block h3{font-size:13px;color:var(--color);letter-spacing:2px;margin-bottom:11px}
.cfg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:9px}
.code-input{width:100%;padding:11px 5px;border-radius:8px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.12);color:white;text-align:center;font:700 18px ui-monospace,monospace;letter-spacing:3px}
.overlay-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.celebration.show{display:block;background:radial-gradient(ellipse at 50% 45%,rgba(40,22,0,.4),rgba(0,0,0,.88) 75%);backdrop-filter:blur(2px)}
#fxCanvas{position:absolute;inset:0;width:100%;height:100%}
.celebration-content{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:90%;text-align:center;pointer-events:none}
.celebration-title{font-size:clamp(28px,6vw,62px);font-weight:900;letter-spacing:4px;background:linear-gradient(#fff6c0,#ffd700 45%,#ff9500);background-clip:text;color:transparent;filter:drop-shadow(0 5px 20px rgba(255,180,0,.5))}
.celebration-sub{margin-top:14px;color:#ffe9a8;letter-spacing:3px;font-size:14px}
.celebration-actions{display:flex;justify-content:center;gap:10px;margin-top:28px;pointer-events:auto;flex-wrap:wrap}
.celebration-actions button{background:rgba(255,215,0,.15);border-color:rgba(255,215,0,.5);color:#ffe9a8;padding:12px 20px}
.toast{position:fixed;z-index:50;left:50%;bottom:25px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#10182b;border:1px solid rgba(255,255,255,.15);padding:11px 18px;border-radius:10px;font-size:13px;transition:.25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:850px){.toolbar{padding:10px 12px}.controls{width:100%}.controls button,.controls select{flex:1}.stage{padding:14px 10px 35px}.top-row{grid-template-columns:1fr;gap:11px}.block{padding:12px}.block.crystal .grid,.block.amber .grid{gap:5px}.block.crystal .digit,.block.amber .digit{width:min(8vw,34px);height:36px;font-size:18px}.overlay-inner{padding:15px}}
@media(max-width:380px){.block.crystal .digit,.block.amber .digit{width:6.8vw;height:31px;font-size:15px}.slot{padding:5px;gap:3px}}
</style>
</head>
<body>
<canvas id="treasureBg"></canvas>
<header class="toolbar">
  <div class="brand"><span class="brand-dot"></span><span>数码揭晓系统</span></div>
  <div class="controls">
    <select id="selSpeed" aria-label="播放速度">
      <option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option><option value="3">3x</option><option value="4">4x</option><option value="8">8x</option>
    </select>
    <button id="btnConfig">剧本配置</button><button id="btnPlay" class="primary">开始演出</button>
    <button id="btnPause" disabled>暂停</button><button id="btnSkip" disabled>跳过</button>
    <button id="btnReplay">重播</button><button id="btnExport">导出</button><button id="btnImport">导入</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </div>
</header>
<main class="stage" id="stage"></main>
<div class="status" id="status">准备就绪 · 共 23 组号码</div>
<div class="overlay" id="overlay">
  <div class="overlay-inner">
    <div class="overlay-header"><div><h2>剧本配置</h2><p>为 23 个槽位填写 4 位数字编码（0000 - 9999）</p></div><div id="cfgStat" style="font-size:12px;color:#888"></div></div>
    <div class="config-body" id="configBody"></div>
    <div class="overlay-actions"><button id="btnRandom">随机填充</button><button id="btnClear">全部清空</button><button id="btnCloseConfig">关闭</button><button id="btnSaveConfig" class="primary">保存并关闭</button></div>
  </div>
</div>
<div class="celebration" id="celebration">
  <canvas id="fxCanvas"></canvas>
  <div class="celebration-content"><div class="celebration-title">演出圆满完成</div><div class="celebration-sub">23 组号码全部揭晓</div><div class="celebration-actions"><button id="btnCloseCelebration">关闭庆祝</button><button id="btnCelebrationReplay">再来一次</button></div></div>
</div>
<div class="toast" id="toast"></div>
<script>
"use strict";
(() => {
const BLOCKS=[
 {key:"diamond",name:"钻石",count:1,color:"#7df9ff",rgb:"125,249,255"},
 {key:"gold",name:"黄金",count:1,color:"#ffd24a",rgb:"255,210,74"},
 {key:"platinum",name:"白金",count:1,color:"#dfe6f0",rgb:"223,230,240"},
 {key:"crystal",name:"水晶",count:10,color:"#b388ff",rgb:"179,136,255"},
 {key:"amber",name:"琥珀",count:10,color:"#ffb300",rgb:"255,179,0"}
];
const DEFAULT_CODES={
 diamond:["6767"],gold:["1234"],platinum:["8888"],
 crystal:["0001","2345","6789","1112","1314","1516","1718","1920","2122","2324"],
 amber:["3334","3536","3738","3940","4142","4344","4546","4748","4950","5152"]
};
const STORAGE_KEY="digital-reveal-codes-v2",SLOT_DURATION=10000,SLOT_GAP=3000,BLOCK_GAP=400;
const clone=o=>JSON.parse(JSON.stringify(o));
const $=s=>document.querySelector(s);
const state={codes:clone(DEFAULT_CODES),draft:null};
let speed=1,running=false,paused=false,skipRequested=false,runToken=0,pauseWaiters=[];
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function normalizeCode(v){let s=String(v??"").replace(/\D/g,"").slice(0,4);return s?s.padStart(4,"0"):"";}
function showToast(msg){const el=$("#toast");el.textContent=msg;el.classList.add("show");clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>el.classList.remove("show"),2000);}
function loadSaved(){try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const data=JSON.parse(raw);for(const b of BLOCKS)if(Array.isArray(data[b.key]))state.codes[b.key]=data[b.key].slice(0,b.count).map(normalizeCode);}}catch(e){console.warn("读取本地号码失败",e);}}
function saveCodes(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state.codes));}catch(e){showToast("浏览器无法保存数据，请检查储存权限");}}
function buildStage(){
 const stage=$("#stage");stage.innerHTML="";
 BLOCKS.forEach((b,bi)=>{
  const card=document.createElement("section");card.className="block "+b.key;card.id="block-"+b.key;card.style.setProperty("--color",b.color);card.style.setProperty("--rgb",b.rgb);
  const header=document.createElement("div");header.className="block-header";
  header.innerHTML=`<span class="block-name">${b.name}</span><span class="block-count">${b.count} 组</span>`;
  const grid=document.createElement("div");grid.className="grid";
  for(let i=0;i<b.count;i++){
   const slot=document.createElement("div");slot.className="slot";slot.id=`slot-${b.key}-${i}`;
   for(let d=0;d<4;d++){const digit=document.createElement("div");digit.className="digit";digit.id=`digit-${b.key}-${i}-${d}`;digit.textContent="—";slot.appendChild(digit);}
   grid.appendChild(slot);
  }
  card.append(header,grid);stage.appendChild(card);
 });
}
function resetDisplay(){
 BLOCKS.forEach(b=>{for(let i=0;i<b.count;i++){const slot=$(`#slot-${b.key}-${i}`);slot.classList.remove("revealing","revealed");for(let d=0;d<4;d++){const el=$(`#digit-${b.key}-${i}-${d}`);el.classList.remove("spinning","locked");el.textContent="—";}}});
 document.querySelectorAll(".block").forEach(x=>x.classList.remove("active"));
}
function updateStatus(t){$("#status").textContent=t;}
function pauseGate(token){if(token!==runToken)return Promise.reject(new Error("cancelled"));if(!paused)return Promise.resolve();return new Promise(resolve=>pauseWaiters.push(resolve));}
function resumeAll(){paused=false;pauseWaiters.splice(0).forEach(fn=>fn());}
async function waitControlled(ms,token){
 let remaining=ms;
 while(remaining>0){
  await pauseGate(token);
  if(token!==runToken)throw new Error("cancelled");
  const started=Date.now();
  await sleep(Math.min(40,remaining));
  if(!paused)remaining-=Date.now()-started;
 }
}
async function revealSlot(b,i,token,sequence,total){
 const code=normalizeCode(state.codes[b.key][i])||"0000";
 const slot=$(`#slot-${b.key}-${i}`);slot.classList.add("revealing");
 const digits=[0,1,2,3].map(d=>$(`#digit-${b.key}-${i}-${d}`));
 const duration=SLOT_DURATION/speed;
 digits.forEach(el=>el.classList.add("spinning"));
 let elapsed=0;
 while(elapsed<duration){
  await pauseGate(token);
  if(token!==runToken)throw new Error("cancelled");
  if(skipRequested)break;
  const frameStarted=Date.now();
  digits.forEach((el,d)=>{
   if(elapsed<duration*(d+1)/4){el.textContent=String(Math.floor(Math.random()*10));}
   else{el.textContent=code[d];el.classList.remove("spinning");el.classList.add("locked");}
  });
  updateStatus(`正在揭晓 ${sequence}/${total} · ${b.name} · ${i+1}/${b.count}`);
  await sleep(45);
  if(!paused)elapsed+=Date.now()-frameStarted;
 }
 digits.forEach((el,d)=>{el.textContent=code[d];el.classList.remove("spinning");el.classList.add("locked");});
 slot.classList.remove("revealing");slot.classList.add("revealed");
}
async function play(fromStart=true){
 if(running)return;
 if(fromStart)resetDisplay();
 running=true;paused=false;skipRequested=false;const token=++runToken;
 setButtons();
 const total=BLOCKS.reduce((n,b)=>n+b.count,0);let seq=0;
 try{
  for(let bi=0;bi<BLOCKS.length;bi++){
   const b=BLOCKS[bi];$(`#block-${b.key}`).classList.add("active");
   for(let i=0;i<b.count;i++){
    if(token!==runToken)throw new Error("cancelled");
    seq++;await revealSlot(b,i,token,seq,total);
    skipRequested=false;
    if(seq<total){await waitControlled(SLOT_GAP/speed,token);}
   }
   $(`#block-${b.key}`).classList.remove("active");
   if(bi<BLOCKS.length-1)await waitControlled(BLOCK_GAP/speed,token);
  }
  updateStatus("揭晓完成 · 23 组号码全部揭晓");
  $("#celebration").classList.add("show");startFireworks();
 }catch(e){if(e.message!=="cancelled")console.error(e);}
 finally{if(token===runToken){running=false;paused=false;skipRequested=false;setButtons();}}
}
function setButtons(){
 $("#btnPlay").disabled=running;$("#btnPause").disabled=!running;$("#btnSkip").disabled=!running;$("#btnPause").textContent=paused?"继续":"暂停";
}
function pauseToggle(){if(!running)return;if(paused){resumeAll();$("#btnPause").textContent="暂停";}else{paused=true;$("#btnPause").textContent="继续";}}
function skip(){if(!running)return;skipRequested=true;resumeAll();showToast("正在跳过当前揭晓");}
function stopPlayback(){runToken++;resumeAll();running=false;paused=false;skipRequested=false;setButtons();}
function openConfig(){
 if(running){showToast("请先结束演出再修改号码");return;}
 state.draft=clone(state.codes);renderConfig();$("#overlay").classList.add("open");
}
function renderConfig(){
 const root=$("#configBody");root.innerHTML="";let filled=0;
 BLOCKS.forEach(b=>{
  const section=document.createElement("section");section.className="cfg-block";section.style.setProperty("--color",b.color);section.style.setProperty("--rgb",b.rgb);
  const h=document.createElement("h3");h.textContent=`${b.name} · ${b.count} 组`;section.appendChild(h);
  const grid=document.createElement("div");grid.className="cfg-grid";
  for(let i=0;i<b.count;i++){
   const input=document.createElement("input");input.className="code-input";input.inputMode="numeric";input.maxLength=4;input.placeholder="0000";input.value=state.draft[b.key][i]||"";input.setAttribute("aria-label",`${b.name}第${i+1}组号码`);
   input.addEventListener("input",()=>{input.value=input.value.replace(/\D/g,"").slice(0,4);state.draft[b.key][i]=input.value;updateCfgStat();});
   grid.appendChild(input);
  }
  section.appendChild(grid);root.appendChild(section);
 });
 updateCfgStat();
}
function updateCfgStat(){let n=0;BLOCKS.forEach(b=>b.count&&state.draft[b.key].forEach(v=>{if(normalizeCode(v).length===4)n++;}));$("#cfgStat").textContent=`已填写 ${n}/23 组`;}
function randomFill(){BLOCKS.forEach(b=>{state.draft[b.key]=Array.from({length:b.count},()=>String(Math.floor(Math.random()*10000)).padStart(4,"0"));});renderConfig();}
function clearDraft(){BLOCKS.forEach(b=>state.draft[b.key]=Array(b.count).fill(""));renderConfig();}
function saveDraft(){BLOCKS.forEach(b=>state.codes[b.key]=state.draft[b.key].map(v=>normalizeCode(v)||"0000"));saveCodes();$("#overlay").classList.remove("open");resetDisplay();showToast("号码已保存");}
function exportData(){
 const payload={app:"Digital Reveal",version:1,exportedAt:new Date().toISOString(),codes:state.codes};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="digital-reveal-codes.json";a.click();URL.revokeObjectURL(url);showToast("号码配置已导出");
}
function importData(file){
 const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);const codes=obj.codes||obj;for(const b of BLOCKS){if(!Array.isArray(codes[b.key])||codes[b.key].length!==b.count)throw new Error("号码组数不正确");const values=codes[b.key].map(v=>String(v));if(values.some(v=>!/^\d{1,4}$/.test(v)))throw new Error("号码必须为1至4位数字");}BLOCKS.forEach(b=>state.codes[b.key]=codes[b.key].map(normalizeCode));saveCodes();resetDisplay();showToast("号码配置导入成功");}catch(e){alert("导入失败："+e.message);}};reader.readAsText(file);
}
let fireAnim=0;
function startFireworks(){
 const canvas=$("#fxCanvas"),ctx=canvas.getContext("2d");canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
 const particles=[];for(let k=0;k<9;k++){const x=Math.random()*innerWidth,y=innerHeight*(.15+Math.random()*.55),h=Math.random()*360;for(let j=0;j<65;j++){const a=Math.PI*2*j/65,v=1+Math.random()*4;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:50+Math.random()*35,h});}}
 cancelAnimationFrame(fireAnim);
 function frame(){ctx.clearRect(0,0,innerWidth,innerHeight);for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.035;p.vx*=.99;p.life--;ctx.fillStyle=`hsla(${p.h},100%,65%,${Math.max(0,p.life/85)})`;ctx.beginPath();ctx.arc(p.x,p.y,2,0,Math.PI*2);ctx.fill();if(p.life<=0)particles.splice(i,1);}if(particles.length)fireAnim=requestAnimationFrame(frame);}
 frame();
}
function stopFireworks(){cancelAnimationFrame(fireAnim);const c=$("#fxCanvas");c.getContext("2d").clearRect(0,0,c.width,c.height);}
function treasureAnimation(){
 const c=$("#treasureBg"),ctx=c.getContext("2d");let w,h,items=[];
 function resize(){w=c.width=innerWidth*devicePixelRatio;h=c.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);items=Array.from({length:34},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:3+Math.random()*8,v:.15+Math.random()*.5,a:.12+Math.random()*.28,rot:Math.random()*6}));}
 resize();addEventListener("resize",resize);
 function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);items.forEach(p=>{p.y-=p.v;p.rot+=.004;if(p.y<-20){p.y=innerHeight+20;p.x=Math.random()*innerWidth;}ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=p.a;const g=ctx.createRadialGradient(-p.r*.3,-p.r*.3,1,0,0,p.r);g.addColorStop(0,"#fff6c0");g.addColorStop(.4,"#ffd700");g.addColorStop(1,"#815900");ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,p.r,0,Math.PI*2);ctx.fill();ctx.restore();});requestAnimationFrame(draw);}
 draw();
}
